<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcel Meyer | Thalia Venturis Partners</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&family=Helvetica+Neue&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1c3d79; --green: #4a7c3f; --border: #e5e7eb; --text-light: #6b7280; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .profile-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(28,61,121,0.08);
    padding: 40px 36px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .profile-logo { width: 64px; height: 64px; margin: 0 auto 10px; display: block; }
  .profile-tagline { font-style: italic; font-weight: 500; font-size: 0.8rem; color: var(--green); margin-bottom: 22px; }
  .profile-name { font-family: 'Roboto Slab', Georgia, serif; font-weight: 700; font-size: 1.7rem; color: #1a1a1a; margin-bottom: 2px; }
  .profile-title { font-weight: 700; font-size: 0.8rem; color: var(--green); letter-spacing: 0.04em; text-transform: uppercase; }
  .profile-rule { height: 1px; background: var(--border); margin: 22px 0; }
  .profile-rows { display: flex; flex-direction: column; gap: 14px; text-align: left; margin-bottom: 28px; }
  .profile-row { display: flex; align-items: center; gap: 12px; }
  .profile-row .icon { flex-shrink: 0; width: 18px; height: 18px; color: var(--green); }
  .profile-row a { color: #222222; font-size: 0.95rem; text-decoration: none; }
  .profile-row a:hover { color: var(--green); text-decoration: underline; }
  .profile-save-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--green); color: #ffffff;
    padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    letter-spacing: 0.02em; text-decoration: none; box-sizing: border-box;
  }
  .profile-save-btn:hover { background: #3d6634; }
  .profile-save-btn svg { width: 18px; height: 18px; }
  .profile-footer { margin-top: 20px; font-size: 0.75rem; color: var(--text-light); }
  .profile-footer a { color: var(--text-light); }
</style>
</head>
