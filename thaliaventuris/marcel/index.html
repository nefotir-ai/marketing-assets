<style>
  :root { --green: #4a7c3f; --border: #e5e7eb; --text-light: #6b7280; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .profile-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(28,61,121,0.08);
    padding: 24px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .card-image {
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    margin-bottom: 20px;
  }
  .profile-save-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--green); color: #ffffff;
    padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    letter-spacing: 0.02em; text-decoration: none; box-sizing: border-box;
  }
  .profile-save-btn:hover { background: #3d6634; }
  .profile-save-btn svg { width: 18px; height: 18px; }
</style>
