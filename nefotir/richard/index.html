<style>
  :root { --teal: #0FBFA6; --border: #e5e7eb; --text-light: #6b7280; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .profile-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(11,30,61,0.12);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .card-image-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .card-image {
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }
  .qr-tap-target {
    position: absolute;
    left: 76.48%;
    top: 59.50%;
    width: 16.76%;
    height: 29.33%;
  }
  .profile-save-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--teal); color: #0B1E3D;
    padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    letter-spacing: 0.02em; text-decoration: none; box-sizing: border-box;
  }
  .profile-save-btn:hover { background: #0a9585; color: #ffffff; }
  .profile-save-btn svg { width: 18px; height: 18px; }
  .profile-secondary-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: #ffffff; color: #0B1E3D; border: 1.5px solid #0B1E3D;
    padding: 13px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    letter-spacing: 0.02em; text-decoration: none; box-sizing: border-box; margin-top: 10px;
  }
  .profile-secondary-btn:hover { background: #0B1E3D; color: #ffffff; }
  .profile-secondary-btn svg { width: 18px; height: 18px; }
</style>
