    position: absolute;
    left: 82.29%;
    top: 66.33%;
    width: 9.52%;
    height: 16.67%;
  }
  .profile-save-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--teal); color: #0B1E3D;
    padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
    letter-spacing: 0.02em; text-decoration: none; box-sizing: border-box;
